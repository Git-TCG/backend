name: repo-tcg

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg}
      POSTGRES_DB: tcg
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg && psql -U tcg -d tcg -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    image: repo-tcg-api
    env_file: .env
    environment:
      DATABASE_URL: postgres://tcg:${POSTGRES_PASSWORD:-tcg}@db:5432/tcg
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: repo-tcg-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tcg:${POSTGRES_PASSWORD:-tcg}@db:5432/tcg
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: repo-tcg-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tcg:${POSTGRES_PASSWORD:-tcg}@db:5432/tcg
    command: ["node", "dist/worker/index.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # 웹 화면과 /api 프록시. GitHub OAuth Redirect URI: http://<호스트>:8123/api/auth/github
  web:
    build: ../frontend
    image: repo-tcg-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:${WEB_PORT:-8123}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
