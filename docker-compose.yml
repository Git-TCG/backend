services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg}
      POSTGRES_DB: tcg
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg && psql -U tcg -d tcg -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://tcg:${POSTGRES_PASSWORD:-tcg}@db:5432/tcg
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tcg:${POSTGRES_PASSWORD:-tcg}@db:5432/tcg
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
